# Build and deploy MERN app to Azure Web App - joboard

name: Build and deploy MERN app to Azure Web App - joboard

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Install server dependencies
        run: npm install --prefix server

      - name: Install client dependencies
        run: npm install --prefix client

      - name: Build React frontend
        run: npm run build --prefix client

      - name: Copy React build into server/public
        run: cp -r client/build/. server/public/

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: |
            server/
            package.json

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_04966D13CAD14BC7B448EB118DD2EA12 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5BF2235A2DFD4F18AB3DAFBCB7AACC0C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_3834F877151644D5B06E1DFDBF3921CC }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'joboard'
          slot-name: 'Production'
          package: .
